<script>
  window.safeAddLine = safeAddLine;
  window.calculate = calculate;
  window.switchView = switchView;
  window.resetAll = resetAll;
  window.copyLine = copyLine;
  window.removeLine = removeLine;
  window.setDisplayMode = setDisplayMode;
  window.switchTab = switchTab;
  window.updateHProv = updateHProv;
  
  // モーダル操作関数をグローバルに登録
  window.openDeviceModal = openDeviceModal;
  window.closeDeviceModal = closeDeviceModal;
  window.selectDevice = selectDevice;
  window.openFixedOptModal = openFixedOptModal;
  window.closeOptModal = closeOptModal;
  window.openKojiModal = openKojiModal;
  window.closeKojiModal = closeKojiModal;
  
  window.forceFetchData = function() {
      if(confirm("スプレッドシートの最新データを読み込みますか？")) {
          localStorage.removeItem("docomo_sim_cache_v2");
          location.reload();
      }
  };

  const DEVICE_CSV_URL   = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxkg_tTd2f_kAcqtH7hXHPq5zbSm-fOHRh3T3ZNAho31pmmGxhhnbbFxqojwDz3j5sRQfB2EZrmMPr/pub?gid=0&single=true&output=csv"; 
  const PLAN_CSV_URL     = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxkg_tTd2f_kAcqtH7hXHPq5zbSm-fOHRh3T3ZNAho31pmmGxhhnbbFxqojwDz3j5sRQfB2EZrmMPr/pub?gid=1240444955&single=true&output=csv"; 
  const OPTION_CSV_URL   = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxkg_tTd2f_kAcqtH7hXHPq5zbSm-fOHRh3T3ZNAho31pmmGxhhnbbFxqojwDz3j5sRQfB2EZrmMPr/pub?gid=585324112&single=true&output=csv"; 
  const DISCOUNT_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxkg_tTd2f_kAcqtH7hXHPq5zbSm-fOHRh3T3ZNAho31pmmGxhhnbbFxqojwDz3j5sRQfB2EZrmMPr/pub?gid=7262986&single=true&output=csv"; 
  const H_PLAN_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxkg_tTd2f_kAcqtH7hXHPq5zbSm-fOHRh3T3ZNAho31pmmGxhhnbbFxqojwDz3j5sRQfB2EZrmMPr/pub?gid=117037676&single=true&output=csv";
  const H_PROV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxkg_tTd2f_kAcqtH7hXHPq5zbSm-fOHRh3T3ZNAho31pmmGxhhnbbFxqojwDz3j5sRQfB2EZrmMPr/pub?gid=1826250395&single=true&output=csv";
  const H_OPT_URL  = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxkg_tTd2f_kAcqtH7hXHPq5zbSm-fOHRh3T3ZNAho31pmmGxhhnbbFxqojwDz3j5sRQfB2EZrmMPr/pub?gid=1143788577&single=true&output=csv";
  const H_DISC_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxkg_tTd2f_kAcqtH7hXHPq5zbSm-fOHRh3T3ZNAho31pmmGxhhnbbFxqojwDz3j5sRQfB2EZrmMPr/pub?gid=843369484&single=true&output=csv";
  const H_DEV_URL  = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxkg_tTd2f_kAcqtH7hXHPq5zbSm-fOHRh3T3ZNAho31pmmGxhhnbbFxqojwDz3j5sRQfB2EZrmMPr/pub?gid=1561318585&single=true&output=csv";
  const H_KOJI_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxkg_tTd2f_kAcqtH7hXHPq5zbSm-fOHRh3T3ZNAho31pmmGxhhnbbFxqojwDz3j5sRQfB2EZrmMPr/pub?gid=1393674300&single=true&output=csv"; 

  let dDev={}, dOpt=[], dPlan={}, dDisc=[];
  let hPlan={}, hProv=[], hOpt=[], hDisc=[], hDev={}, hKoji=[];
  let deviceCategories = new Set(); 
  
  let myChart = null; 
  let lineCounter = 0; 
  let mandatoryFeeTotal = 0; 
  let activeLineId = null;
  let currentDisplayMode = 'all';
  
  let editingDeviceLineId = null; 
  let editingDeviceType = 'mobile'; 
  let editingOptLineId = null; 
  let editingKojiLineId = null; // ★光工事費編集用のID管理

  let mPlanHtml = `<option value="none">未選択</option>`;
  let mCallHtml = `<option value="none">未加入 (0円)</option>`, mHoshouHtml = `<option value="none">未加入 (0円)</option>`;
  let mOtherHtml = ``, mSpHtml = ``, mCpHtml = ``;

  let hPlanHtml = `<option value="none">未選択</option>`, hDevHtml = `<option value="none">機器なし / その他</option>`;
  let hOptHtml = ``, hCpHtml = ``, hKojiHtml = ``;

  function parseCSV(text) {
    if (!text) return [];
    text = text.replace(/^\uFEFF/, ''); 
    const lines = text.trim().split('\n').filter(l => l && !l.match(/^\|?[\s:-]+\|?$/));
    if (lines.length < 2) return [];

    let delimiter = ',';
    if (lines[0].includes('\t')) delimiter = '\t';
    if (lines[0].includes('|') && !lines[0].includes(',')) delimiter = '|';

    const splitRow = (str) => {
        let arr = []; let cur = ''; let inQ = false;
        for(let i=0; i<str.length; i++) {
            let c = str[i];
            if(c === '"') { inQ = !inQ; }
            else if(c === delimiter && !inQ) { arr.push(cur.trim()); cur = ''; }
            else { cur += c; }
        }
        arr.push(cur.trim());
        if(delimiter === '|' && arr[0] === '') arr.shift();
        if(delimiter === '|' && arr[arr.length-1] === '') arr.pop();
        return arr;
    };

    const rawHeaders = splitRow(lines[0]);
    const headers = rawHeaders.map(h => h.replace(/[\uFEFF\u200B\*\s"']/g, '').toLowerCase().replace(/ｉ/g, 'i').replace(/ｄ/g, 'd'));

    return lines.slice(1).map(line => {
       const vals = splitRow(line);
       let obj = {};
       headers.forEach((h, idx) => { obj[h] = vals[idx] || ""; });
       return obj;
    }).filter(obj => Object.keys(obj).some(k => obj[k] !== ""));
  }

  const getNum = (val) => Number(String(val).replace(/[,円回]/g, '').trim()) || 0;

  async function init() {
    try {
      const CACHE_KEY = "docomo_sim_cache_v2";
      let texts = null;
      
      try {
          let cached = localStorage.getItem(CACHE_KEY);
          if (cached) {
              let parsed = JSON.parse(cached);
              if (Date.now() - parsed.time < 12 * 60 * 60 * 1000) {
                  texts = parsed.data;
              }
          }
      } catch(e) {}

      if (!texts) {
          const fetchTxt = async (url) => { if(!url) return ""; try { return await (await fetch(url)).text(); } catch(e) { return ""; } };
          texts = await Promise.all([
            fetchTxt(DEVICE_CSV_URL), fetchTxt(PLAN_CSV_URL), fetchTxt(OPTION_CSV_URL), fetchTxt(DISCOUNT_CSV_URL),
            fetchTxt(H_PLAN_URL), fetchTxt(H_PROV_URL), fetchTxt(H_OPT_URL), fetchTxt(H_DISC_URL),
            fetchTxt(H_DEV_URL), fetchTxt(H_KOJI_CSV_URL)
          ]);
          try { localStorage.setItem(CACHE_KEY, JSON.stringify({ time: Date.now(), data: texts })); } catch(e) {}
      }

      const [tDev, tPlan, tOpt, tDisc, tHPlan, tHProv, tHOpt, tHDisc, tHDev, tHKoji] = texts;

      parseCSV(tDev).forEach(p => {
        let id = p.id || p.ID || `dev_${Math.random()}`;
        let name = p.name || p.名前 || p.名称 || p.機種名 || id;
        if(name === id && !p.price_total) return; 
        
        let cat = p.category || p.カテゴリ || "スマホ"; 
        deviceCategories.add(cat);
        
        dDev[id] = {
          name: name, category: cat, price_total: getNum(p.price_total || p.総額),
          hoshou_price: getNum(p.hoshou_price), applecare_price: getNum(p.applecare_price), applecare_theft_price: getNum(p.applecare_theft_price),
          kisyu: {m1: getNum(p.kisyu_m1), m2: getNum(p.kisyu_m2), m24: getNum(p.kisyu_m24)},
          shinki: {m1: getNum(p.shinki_m1), m2: getNum(p.shinki_m2), m24: getNum(p.shinki_m24)},
          mnp: {m1: getNum(p.mnp_m1), m2: getNum(p.mnp_m2), m24: getNum(p.mnp_m24)}
        };
      });

      parseCSV(tPlan).forEach(p => {
        let id = p.id || p.ID || `plan_${Math.random()}`;
        let name = p.name || p.名前 || p.名称 || p.プラン名 || id;
        let price = getNum(p.price || p.料金);
        dPlan[id] = { name: name, price: price, family: (p.family_ok||p.family)==="1", dcard: (p.dcard_ok||p.dcard)==="1", hikari: (p.hikari_ok||p.hikari)==="1", denki: (p.denki_ok||p.denki)==="1", raw: p };
        mPlanHtml += `<option value="${id}">${name} : ${price.toLocaleString()}円</option>`;
      });

      parseCSV(tOpt).forEach(o => {
        let id = o.id || o.ID || `opt_${Math.random()}`;
        let name = o.name || o.名前 || o.名称 || id;
        let price = getNum(o.price || o.料金);
        let type = o.type || o.タイプ || "other";
        if(type==="mandatory") mandatoryFeeTotal += price;
        else if(type==="call") mCallHtml += `<option value="${id}" data-price="${price}">${name} (+${price}円)</option>`;
        else if(type==="hoshou") mHoshouHtml += `<option value="${id}" data-price="${price}">${name} (+${price}円)</option>`;
        else if(type==="other") mOtherHtml += `<label class="check-label dyn-other-opt" data-price="${price}"><input type="checkbox" onchange="calculate()"> ${name}</label>`;
        else if(type==="special") mSpHtml += `<label class="check-label special-opt" data-price="${price}"><input type="checkbox" onchange="calculate()"> <span style="color:#cc0000; font-weight:bold;">${name}</span></label>`;
      });

      parseCSV(tDisc).forEach(d => {
        let id = d.id || d.ID || `disc_${Math.random()}`;
        let name = d.name || d.名前 || d.名称 || d.キャンペーン名 || id;
        dDisc.push({id: id, name: name, duration: getNum(d.duration || d.期間)});
        mCpHtml += `<label class="check-label camp-opt camp-opt-${id}"><input type="checkbox" onchange="calculate()"><span style="color:#cc0000; font-weight:bold;">${name}</span></label>`;
      });

      parseCSV(tHPlan).forEach(p => {
        let id = p.id || p.ID || `hplan_${Math.random()}`;
        let name = p.name || p.名前 || p.名称 || p.プラン名 || id;
        let price = getNum(p.price || p.料金);
        let pType = p.prov_type || p.type || "none";
        hPlan[id] = { name: name, price: price, prov_type: pType, raw: p };
        hPlanHtml += `<option value="${id}">${name} : ${price.toLocaleString()}円</option>`;
      });

      parseCSV(tHProv).forEach(p => {
        let id = p.id || p.ID || `hprov_${Math.random()}`;
        let name = p.name || p.名前 || p.プロバイダ名 || id;
        let pType = p.prov_type || p.type || "none";
        hProv.push({id: id, name: name, prov_type: pType});
      });

      parseCSV(tHOpt).forEach(o => {
        let id = o.id || o.ID || `hopt_${Math.random()}`;
        let name = o.name || o.名前 || o.名称 || id;
        let price = getNum(o.price || o.料金);
        hOpt.push({id: id, name: name, price: price});
        hOptHtml += `<label class="check-label dyn-hopt" data-price="${price}"><input type="checkbox" onchange="calculate()"> ${name} (+${price}円)</label>`;
      });

      parseCSV(tHDisc).forEach(d => {
        let id = d.id || d.ID || `hdisc_${Math.random()}`;
        let name = d.name || d.名前 || d.名称 || d.キャンペーン名 || id;
        hDisc.push({id: id, name: name, price: getNum(d.price || d.割引額 || d.割引 || d.val || d.value || d.金額), duration: getNum(d.duration || d.期間 || d.times)});
        hCpHtml += `<label class="check-label hcamp-opt hcamp-opt-${id}"><input type="checkbox" onchange="calculate()"><span style="color:#cc0000; font-weight:bold;">${name}</span></label>`;
      });

      parseCSV(tHDev).forEach(d => {
        let id = d.id || d.ID || `hdev_${Math.random()}`;
        let name = d.name || d.名前 || d.名称 || d.機器名 || id;
        hDev[id] = {
          name: name, price_total: getNum(d.price_total||d.総額),
          d12_1: getNum(d.div12_m1||d.d12_1), d12_2: getNum(d.div12_m2||d.d12_2),
          d24_1: getNum(d.div24_m1||d.d24_1), d24_2: getNum(d.div24_m2||d.d24_2),
          d36_1: getNum(d.div36_m1||d.d36_1), d36_2: getNum(d.div36_m2||d.d36_2),
          d48_1: getNum(d.div48_m1||d.d48_1), d48_2: getNum(d.div48_m2||d.d48_2),
          sup_1: getNum(d.support_m1||d.sup_1), sup_2: getNum(d.support_m2||d.sup_2), sup_t: getNum(d.support_times||d.sup_t)
        };
        hDevHtml += `<option value="${id}">${name}</option>`;
      });

      parseCSV(tHKoji).forEach(k => {
        let id = k.id || k.ID || `hkoji_${Math.random()}`;
        let name = k.name || k.名前 || k.名称 || k.工事名 || id;
        let total = getNum(k.price_total || k.総額);
        let d12m1 = getNum(k.d12_m1), d12m2 = getNum(k.d12_m2);
        let d24m1 = getNum(k.d24_m1), d24m2 = getNum(k.d24_m2);
        hKojiHtml += `<label class="check-label dyn-hkoji" data-total="${total}" data-d12m1="${d12m1}" data-d12m2="${d12m2}" data-d24m1="${d24m1}" data-d24m2="${d24m2}"><input type="checkbox" onchange="calculate()"> ${name}</label>`;
      });

      document.getElementById('addMobileBtn').disabled = false;
      document.getElementById('addMobileBtn').innerHTML = '📱 スマホ追加';
      document.getElementById('addFixedBtn').disabled = false;
      document.getElementById('addFixedBtn').innerHTML = '🌐 光・home5G追加';

      initChart(new Array(48).fill(0), new Array(48).fill(0));
    } catch (e) { console.error(e); alert("読み込みエラーが発生しました。"); }
  }

  function closeDeviceModal() {
    document.getElementById('deviceModal').style.display = 'none';

  function renderDeviceGrid(category, type = 'mobile') {
    const grid = document.getElementById('modalGrid');
    grid.innerHTML = '';
    
    if (type === 'mobile') {
      for(const id in dDev) {
        if(dDev[id].category === category) {
          let nameLower = dDev[id].name.toLowerCase();
          let isApple = nameLower.includes("iphone") || nameLower.includes("ipad");
          let icon = isApple ? "🍎" : "📱";
          if(nameLower.includes("キッズ")) icon = "🧒";
          
          let priceText = dDev[id].price_total > 0 ? `総額目安: ${dDev[id].price_total.toLocaleString()}円` : "";
          
          grid.innerHTML += `
            <div class="device-card" onclick="selectDevice('${id}')">
              <div class="device-card-img">${icon}</div>
              <div class="device-card-name">${dDev[id].name}</div>
              <div class="device-card-price">${priceText}</div>
            </div>
          `;
        }
      }
    } else {
      for(const id in hDev) {
        let nameLower = hDev[id].name.toLowerCase();
        let icon = "🌐";
        if(nameLower.includes("home") || nameLower.includes("hr")) icon = "🏠";
        
        let priceText = hDev[id].price_total > 0 ? `総額目安: ${hDev[id].price_total.toLocaleString()}円` : "";
        
        grid.innerHTML += `
          <div class="device-card" onclick="selectDevice('${id}')">
            <div class="device-card-img">${icon}</div>
            <div class="device-card-name">${hDev[id].name}</div>
            <div class="device-card-price">${priceText}</div>
          </div>
        `;
      }
    }
  }

  function openFixedOptModal(lineId) {
      editingOptLineId = lineId;
      const block = document.getElementById(lineId);
      const hiddenGrid = block.querySelector('.hidden-hopt-container');
      const modalGrid = document.getElementById('optModalGrid');
      modalGrid.innerHTML = '';

      const labels = hiddenGrid.querySelectorAll('.dyn-hopt');
      labels.forEach((lbl, index) => {
          const cb = lbl.querySelector('input');
          let text = lbl.innerText.trim();
          const isDisabled = cb.disabled;
          const isChecked = cb.checked;

          const div = document.createElement('div');
          div.style.display = 'flex';
          div.style.alignItems = 'center';
          div.style.padding = '14px 16px';
          div.style.marginBottom = '10px';
          div.style.borderRadius = '10px';
          div.style.border = isDisabled ? '1px solid #eee' : (isChecked ? '2px solid #cc0000' : '1px solid #ddd');
          div.style.background = isChecked ? '#fff0f5' : '#fff';
          div.style.opacity = isDisabled ? '0.5' : '1';
          div.style.cursor = isDisabled ? 'not-allowed' : 'pointer';
          div.style.transition = 'all 0.2s';
          
          div.onmouseenter = () => { if(!cb.disabled && !cb.checked) div.style.backgroundColor = '#fafbfc'; };
          div.onmouseleave = () => { if(!cb.disabled && !cb.checked) div.style.backgroundColor = '#fff'; };

          div.innerHTML = `
              <input type="checkbox" style="transform: scale(1.4); margin-right: 16px; accent-color: #cc0000; cursor:inherit;" ${isChecked ? 'checked' : ''} ${isDisabled ? 'disabled' : ''}>
              <span style="font-weight: bold; font-size: 14px; color: ${isChecked ? '#cc0000' : '#333'}; line-height: 1.4;">${text}</span>
          `;

          div.onclick = (e) => {
              if (cb.disabled) return;
              if (e.target.tagName !== 'INPUT') {
                  const input = div.querySelector('input');
                  input.checked = !input.checked;
              }
              cb.checked = div.querySelector('input').checked;
              calculate();
          };
          
          modalGrid.appendChild(div);
      });
      
      document.getElementById('optModal').style.display = 'flex';
  }

  function updateHProv(lineId) {
    const block = document.getElementById(lineId);
    if(!block) return;
    const planSel = block.querySelector('.hPlanSelect');
    if(!planSel) return;
    const planId = planSel.value;
    const provSel = block.querySelector('.hProvSelect');
    const pType = hPlan[planId] ? hPlan[planId].prov_type : 'none';
    
    provSel.innerHTML = '<option value="none">不要 / 未選択</option>';
    if (pType === 'none') { provSel.disabled = true; } 
    else {
      provSel.disabled = false;
      hProv.forEach(p => { if(p.prov_type === pType || p.prov_type === 'all') provSel.innerHTML += `<option value="${p.id}">${p.name}</option>`; });
    }
  }

  function copyLine() {
    if(!activeLineId) return;
    const src = document.getElementById(activeLineId);
    const type = src.getAttribute("data-type");
    addLine(type); 
    const dest = document.getElementById(activeLineId);
    
    src.querySelectorAll('select').forEach((sel, i) => { if(dest.querySelectorAll('select')[i]) dest.querySelectorAll('select')[i].value = sel.value; });
    src.querySelectorAll('input[type="number"]').forEach((inp, i) => { if(dest.querySelectorAll('input[type="number"]')[i]) dest.querySelectorAll('input[type="number"]')[i].value = inp.value; });
    src.querySelectorAll('input[type="checkbox"]').forEach((chk, i) => { if(dest.querySelectorAll('input[type="checkbox"]')[i]) dest.querySelectorAll('input[type="checkbox"]')[i].checked = chk.checked; });
    
    if(type==='mobile') {
        let hVal = src.querySelector('.hiddenDeviceVal');
        let dName = src.querySelector('.displayDeviceName');
        if(hVal && dest.querySelector('.hiddenDeviceVal')) dest.querySelector('.hiddenDeviceVal').value = hVal.value;
        if(dName && dest.querySelector('.displayDeviceName')) dest.querySelector('.displayDeviceName').innerText = dName.innerText;
    } else {
        let hDevVal = src.querySelector('.hDevSelect');
        let hDevName = src.querySelector('.displayHDevName');
        if(hDevVal && dest.querySelector('.hDevSelect')) dest.querySelector('.hDevSelect').value = hDevVal.value;
        if(hDevName && dest.querySelector('.displayHDevName')) dest.querySelector('.displayHDevName').innerText = hDevName.innerText;

        updateHProv(activeLineId);
    }
    calculate();
  }

  function removeLine(id) {
    let el = document.getElementById(id);
    if(el) el.remove();
    const remain = document.querySelectorAll('.line-container');
    if (remain.length > 0) {
      activeLineId = remain[0].id;
      remain[0].style.display = 'block';
    } else { activeLineId = null; }
    renderTabs(); calculate();
  }

  function resetAll() {
    if(!confirm("全てクリアして空にしますか？")) return;
    document.getElementById("linesContainer").innerHTML = "";
    lineCounter = 0; activeLineId = null;
    renderTabs(); calculate();

  function initChart(pData, dData) {
    const ctx = document.getElementById('costChart');
    if(!ctx) return;
    if(myChart) myChart.destroy();
    myChart = new Chart(ctx.getContext('2d'), {
      type: 'bar',
      data: { labels: Array.from({length:48}, (_,i)=>`${i+1}ヵ月目`), datasets: [{label:'工事/機器(合算)', data:dData, backgroundColor:'#ff4d6d', stack:'0'}, {label:'通信/OP料(合算)', data:pData, backgroundColor:'#118ab2', stack:'0'}] },
      options: { responsive:true, maintainAspectRatio:false, scales:{x:{stacked:true}, y:{stacked:true, beginAtZero:true}}, plugins:{legend:{position:'top'}} }
    });
  }

  function calculate() {
    let grandM2 = 0; let singleActiveM2 = 0;
    let arrP = new Array(48).fill(0); let arrD = new Array(48).fill(0); let adminTot = 0;
    const blocks = document.querySelectorAll('.line-container');
    let bHtml = '';

    if (blocks.length === 0) {
      if(document.getElementById("bottomLineTotals")) document.getElementById("bottomLineTotals").innerHTML = "";
      if(document.getElementById("grandTotalDisplay")) document.getElementById("grandTotalDisplay").innerText = "0";
      if(myChart){ myChart.data.datasets[0].data=arrD; myChart.data.datasets[1].data=arrP; myChart.update(); }
      generateTimeline(arrP, arrD, 0); return;
    }

    blocks.forEach((block, index) => {
      const type = block.getAttribute("data-type");
      let lM2 = 0; let lineAdminFee = 4950; adminTot += lineAdminFee;

      if (type === 'mobile') {
        const ct = block.querySelector('.contractTypeSelect')?.value || "kisyu";
        const devId = block.querySelector('.hiddenDeviceVal')?.value || "none";
        const payMethod = block.querySelector('.payMethodSelect')?.value || "kaedoki";
        const pId = block.querySelector('.planSelect')?.value || "none";
        const pObj = dPlan[pId] || {price:0, raw:{}};
        
        let dName = (dDev[devId] && dDev[devId].name) ? dDev[devId].name : "";
        const isKidsDev = (devId !== "none" && dName.includes("キッズ"));
        const isAhamo = pId.includes("ahamo") || (pObj.name && pObj.name.toLowerCase().includes("ahamo"));
        const isKidsP = pId.includes("kids") || (pObj.name && pObj.name.includes("キッズ"));

        Array.from(block.querySelector('.planSelect').options).forEach(o => {
          if(o.value==="none") return;
          let isKidsP_opt = o.value.includes("kids") || o.text.includes("キッズ");
          let isDeb = o.value.includes("debut") || o.text.includes("デビュー");
          let hide = false;
          if(isKidsDev){ if(!isKidsP_opt) hide=true; } else { if(isKidsP_opt) hide=true; }
          if(ct==="mnp" && isDeb) hide=true;
          o.style.display = hide ? "none" : ""; o.disabled = hide;
          if(hide && pId===o.value) block.querySelector('.planSelect').value = "none";
        });
        
        if(isKidsDev && block.querySelector('.planSelect').value==="none") {
            let kOpt = Array.from(block.querySelector('.planSelect').options).find(o=>o.value.includes("kids"));
            if(kOpt) block.querySelector('.planSelect').value = kOpt.value;
        }

        let d1=0, d2=0, d24=0;
        let md = parseInt(block.querySelector('.manualDeviceDiscount')?.value)||0;
        
        if(devId!=="none" && dDev[devId]){
          let dd = dDev[devId];
          if (payMethod === 'ikkatsu') {
            d1 = Math.max(0, dd.price_total - md);
            d2 = 0;
            d24 = 0;
            if(block.querySelector('.devicePriceHint')) block.querySelector('.devicePriceHint').innerText = "一括払い";
          } else {
            d1 = Math.max(0, dd[ct].m1 - md); 
            d2 = Math.max(0, dd[ct].m2 - md); 
            d24 = dd[ct].m24;
            if(block.querySelector('.devicePriceHint')) block.querySelector('.devicePriceHint').innerText = dd[ct].m2.toLocaleString() + "円/月";
          }
        } else {
          if(block.querySelector('.devicePriceHint')) block.querySelector('.devicePriceHint').innerText = "0円/月";
        }
        if(block.querySelector('.col-total-device')) block.querySelector('.col-total-device').innerText = d2.toLocaleString();

        const cSel = block.querySelector('.callOptSelect');
        if(cSel){
          if(isKidsP){ cSel.value="none"; cSel.disabled=true; cSel.style.opacity="0.4"; }
          else {
            cSel.disabled=false; cSel.style.opacity="1";
            Array.from(cSel.options).forEach(o => {
              if(o.value==="none") return;
              let op = Number(o.getAttribute("data-price")); let n = o.text.split(' ')[0];
              if(isAhamo){
                if(op==880 || n.includes("5分")){ o.style.display="none"; o.disabled=true; if(cSel.value===o.value) cSel.value="none"; }
                else if(op==1980 || n.includes("かけ放題")){ o.style.display=""; o.disabled=false; o.text=`${n} (+1100円)`; }
              } else { o.style.display=""; o.disabled=false; o.text=`${n} (+${op}円)`; }
            });
          }
        }
        
        block.querySelectorAll('.dyn-other-opt').forEach(l=>{ let cb=l.querySelector('input'); if(isKidsP){ cb.disabled=true; cb.checked=false; l.style.opacity="0.4"; }else{ cb.disabled=false; l.style.opacity="1"; } });

        let oChk = false;
        block.querySelectorAll('.special-opt').forEach(lbl => {
            if(lbl.innerText.includes('大盛り')) {
                let cb = lbl.querySelector('input');
                if(!isAhamo || isKidsP) { cb.disabled = true; cb.checked = false; lbl.style.opacity = "0.4"; }
                else { cb.disabled = false; lbl.style.opacity = "1"; oChk = cb.checked; }
            }
        });

        block.querySelectorAll('.special-opt').forEach(lbl => {
            if(lbl.innerText.includes('ポイ活')) {
                let cb = lbl.querySelector('input');
                if(!isAhamo || !oChk || isKidsP) { cb.disabled = true; cb.checked = false; lbl.style.opacity = "0.4"; }
                else { cb.disabled = false; lbl.style.opacity = "1"; }
            }
        });

        const hSel = block.querySelector('.hoshouSelect');
        if(hSel){
          Array.from(hSel.options).forEach(o=>{
            if(o.value==="none") return; let sh=true; let hp=0; let n=o.text.split(' ')[0];
            if(o.value==="smart_anshin") hp = (devId!=="none"&&dDev[devId])?dDev[devId].hoshou_price : Number(o.getAttribute("data-price"));
            else if(o.value==="applecare") { if(devId==="none"||!dDev[devId]||dDev[devId].applecare_price===0) sh=false; else hp=dDev[devId].applecare_price; }
            else if(o.value==="applecare_theft") { if(devId==="none"||!dDev[devId]||dDev[devId].applecare_theft_price===0) sh=false; else hp=dDev[devId].applecare_theft_price; }
            else hp=Number(o.getAttribute("data-price"));
            if(sh){ o.style.display=""; o.disabled=false; o.text=`${n} (+${hp}円)`; } else { o.style.display="none"; o.disabled=true; if(hSel.value===o.value) hSel.value="none"; }
          });
        }

        let pTot = pObj.price + mandatoryFeeTotal;
        if(cSel && cSel.value!=="none"){ let p=Number(cSel.options[cSel.selectedIndex].getAttribute("data-price")); if(isAhamo && p==1980) p=1100; pTot+=p; }
        if(hSel && hSel.value!=="none"){
          if(hSel.value==="smart_anshin"&&dDev[devId]) pTot+=dDev[devId].hoshou_price;
          else if(hSel.value==="applecare"&&dDev[devId]) pTot+=dDev[devId].applecare_price;
          else if(hSel.value==="applecare_theft"&&dDev[devId]) pTot+=dDev[devId].applecare_theft_price;
          else pTot+=Number(hSel.options[hSel.selectedIndex].getAttribute("data-price"));
        }
        block.querySelectorAll('.dyn-other-opt input:checked, .special-opt input:checked').forEach(cb=>pTot+=Number(cb.closest('.check-label').getAttribute("data-price")));
        if(block.querySelector('.col-total-plan')) block.querySelector('.col-total-plan').innerText = pTot.toLocaleString();

        const famV = parseInt(block.querySelector('.familySelect')?.value || 0);
        const hikV = block.querySelector('.hikariCheck input')?.checked ? 1210 : 0;
        if(block.querySelector('.familySelect')) block.querySelector('.familySelect').disabled = !pObj.family;
        if(block.querySelector('.hikariCheck input')) block.querySelector('.hikariCheck input').disabled = !pObj.hikari;
        
        const setD = (s, a)=>{ let el=block.querySelector(s); if(!el)return; el.disabled=!a; if(el.closest('.check-label')) el.closest('.check-label').style.opacity=a?"1":"0.4"; else el.style.opacity=a?"1":"0.4"; if(!a){if(el.type==='checkbox')el.checked=false;else el.value="0";} };
        setD('.dcardSelect', pObj.dcard); setD('.denkiCheck input', pObj.denki);
        
        dDisc.forEach(d=>{ 
            let a = (Number(pObj.raw[d.id+'_val'])||0) > 0; 
            if(d.name.includes("U15") && pObj.name && pObj.name.includes("デビュー")) a = true; 
            setD(`.camp-opt-${d.id} input`, a); 
        });

        let dcVal = parseInt(block.querySelector('.dcardSelect')?.value || 0);
        let dnVal = block.querySelector('.denkiCheck input')?.checked && pObj.denki ? 110 : 0;
        let dM2 = (pObj.family?famV:0) + (pObj.hikari?hikV:0) + (pObj.dcard?dcVal:0) + dnVal;
        
        dDisc.forEach(d=>{
          let cb=block.querySelector(`.camp-opt-${d.id} input`);
          if(cb&&cb.checked){ 
              let v=Number(pObj.raw[d.id+'_val'])||0; 
              if(v===0 && d.price) v = d.price;
              if(v===0 && d.name.includes("U15") && pObj.name && pObj.name.includes("デビュー")) {
                  v = pObj.name.includes("20GB") ? 1870 : 1100; 
              }
              dM2+=v; 
          }
        });
        
        let cap = pTot - mandatoryFeeTotal;
        if(block.querySelector('.col-total-discount')) block.querySelector('.col-total-discount').innerText = Math.max(0, Math.min(dM2, cap)).toLocaleString();

        for(let m=1; m<=48; m++){
          let md=0; if(pObj.family)md+=famV; if(pObj.hikari)md+=hikV; if(pObj.dcard)md+=dcVal; if(dnVal>0)md+=dnVal;
          dDisc.forEach(d=>{ 
              let cb=block.querySelector(`.camp-opt-${d.id} input`); 
              if(cb&&cb.checked){ 
                  let v=Number(pObj.raw[d.id+'_val'])||0; 
                  if(v===0 && d.price) v = d.price;
                  if(v===0 && d.name.includes("U15") && pObj.name && pObj.name.includes("デビュー")) {
                      v = pObj.name.includes("20GB") ? 1870 : 1100; 
                  }
                  if(d.duration===0||m<=d.duration) md+=v; 
              } 
          });
          
          let pFinal = Math.max(0, (pTot - mandatoryFeeTotal) - md) + mandatoryFeeTotal; 
          if(m===1) arrP[m-1]+=(pFinal+lineAdminFee); else arrP[m-1]+=pFinal;

          let dv=0; if(m===1)dv=d1; else if(m<=23)dv=d2; else if(m===24)dv=d24;
          arrD[m-1]+=dv;
          if(m===2){ lM2 = pFinal+dv; grandM2 += lM2; }
        }
        if(block.querySelector('.line-final-total')) block.querySelector('.line-final-total').innerText = lM2.toLocaleString();
        if (block.id === activeLineId) singleActiveM2 = lM2;
        let bClass = (block.id===activeLineId) ? 'active-badge' : '';
        bHtml += `<div class="line-badge ${bClass}" onclick="switchTab('${block.id}')">📱 ${index+1}回線目<span>${lM2.toLocaleString()}円</span></div>`;
      
      } else if (type === 'fixed') {
        const devSel = block.querySelector('.hDevSelect');
        const planSel = block.querySelector('.hPlanSelect');
        const selDevName = (devSel && devSel.value!=="none"&&hDev[devSel.value]) ? hDev[devSel.value].name : "";
        const isHome5GDev = devSel && (devSel.value.includes("home") || devSel.value.includes("hr") || selDevName.includes("home") || selDevName.includes("HR"));

        let planText = "";
        if(planSel){
          Array.from(planSel.options).forEach(opt => {
            if (opt.value === "none") return;
            let isHomePlan = opt.value.includes("home") || opt.text.includes("home") || opt.text.includes("5G");
            let hide = false;
            if (isHome5GDev) { if(!isHomePlan) hide=true; } 
            else { if(isHomePlan && devSel.value!=="none") hide=true; }

            if (hide) {
              opt.style.display = "none"; opt.disabled = true;
              if (planSel.value === opt.value) planSel.value = "none";
            } else {
              opt.style.display = ""; opt.disabled = false;
            }
          });
          
          if (isHome5GDev && planSel.value==="none") {
              let hOpt = Array.from(planSel.options).find(o=>o.value.includes("home") || o.text.includes("home"));
              if(hOpt) planSel.value = hOpt.value;
          }
          if(planSel.selectedIndex >= 0) {
              planText = planSel.options[planSel.selectedIndex].text;
          }
        }

        const isHomePlanSelected = planText.includes("home") || planText.includes("5G");
        const isHome5G = isHome5GDev || isHomePlanSelected;
        const is10G = planText.includes("10ギガ") || planText.includes("10G");
        const isKodate = planText.includes("戸建") || planText.includes("戸建て") || planText.includes("ファミリー");
        const isTvAvailable = !isHome5G && (isKodate || is10G);

        let isPhoneValue = false;
        let hasPhoneOpt = false;
        let hasTvOpt = false;

        block.querySelectorAll('.dyn-hopt').forEach(lbl => {
            if (lbl.innerText.includes("ドコモ光電話バリュー") && lbl.querySelector('input').checked) {
                isPhoneValue = true;
            }
        });

        // 各オプションの有効/無効化制御
        block.querySelectorAll('.dyn-hopt').forEach(lbl => {
            let cb = lbl.querySelector('input');
            let txt = lbl.innerText;
            
            let isHikariOnly = txt.includes("光") || txt.includes("テレビ") || txt.includes("TV") || txt.includes("ひかり") || txt.includes("着信") || txt.includes("転送") || txt.includes("番号") || txt.includes("リクエスト") || txt.includes("ストップ") || txt.includes("チャンネル");
            let isTvService = txt.includes("テレビ") || txt.includes("TV");

            let isBundleDuplicate = false;
            if (isPhoneValue) {
                if (txt.includes("ドコモ光電話") && !txt.includes("バリュー")) isBundleDuplicate = true;
                if (txt.includes("通話中着信")) isBundleDuplicate = true;
                if (txt.includes("転送でんわ")) isBundleDuplicate = true;
                if (txt.includes("発信者番号表示")) isBundleDuplicate = true;
                if (txt.includes("ナンバー・リクエスト")) isBundleDuplicate = true;
                if (txt.includes("迷惑電話ストップサービス")) isBundleDuplicate = true;
                if (txt.includes("着信お知らせメール")) isBundleDuplicate = true;
            }

            if (isTvService && !isTvAvailable) {
                cb.checked = false;
                cb.disabled = true;
                lbl.style.opacity = "0.4";
            } else if (isHome5G && isHikariOnly) {
                cb.checked = false;
                cb.disabled = true;
                lbl.style.opacity = "0.4";
            } else if (isBundleDuplicate) {
                cb.checked = false;
                cb.disabled = true;
                lbl.style.opacity = "0.4";
            } else {
                cb.disabled = false;
                lbl.style.opacity = "1";
            }

            if (cb.checked) {
                if (txt.includes("光電話") || txt.includes("光電話バリュー")) hasPhoneOpt = true;
                if (isTvService) hasTvOpt = true;
            }
        });

        // 光オプションの選択数をUIに反映
        let optCheckedCount = 0;
        let optTotal = 0;
        block.querySelectorAll('.dyn-hopt input:checked').forEach(cb => {
            optCheckedCount++;
            optTotal += Number(cb.closest('.check-label').getAttribute("data-price"));
        });
        const optSummary = block.querySelector('.displayHOptText');
        if (optSummary) {
            if (optCheckedCount === 0) {
                optSummary.innerText = "選択なし";
                optSummary.style.color = "#888";
            } else {
                optSummary.innerHTML = `<span style="color:#cc0000;">${optCheckedCount}件選択中 (+${optTotal.toLocaleString()}円)</span>`;
            }
        }
        if (editingOptLineId === block.id) {
            updateOptModalUI();
        }

        const kojiPaySel = block.querySelector('.hKojiPaySelect');
        if (kojiPaySel) {
            kojiPaySel.disabled = isHome5G;
            kojiPaySel.style.opacity = isHome5G ? "0.4" : "1";
        }

        block.querySelectorAll('.dyn-hkoji').forEach(lbl => {
            let cb = lbl.querySelector('input');
            let txt = lbl.innerText;
            let isPhoneKoji = txt.includes("電話");
            let isTvKoji = txt.includes("テレビ") || txt.includes("TV");

            if (isHome5G) {
                cb.checked = false;
                cb.disabled = true;
                lbl.style.opacity = "0.4";
            } else if (isPhoneKoji && !hasPhoneOpt) {
                cb.checked = false;
                cb.disabled = true;
                lbl.style.opacity = "0.4";
            } else if (isTvKoji && !hasTvOpt) {
                cb.checked = false;
                cb.disabled = true;
                lbl.style.opacity = "0.4";
            } else {
                cb.disabled = false;
                lbl.style.opacity = "1";
            }
        });

        // ★追加：光工事費の選択数をUIに反映、モーダルが開いていれば更新
        if (editingKojiLineId === block.id) {
            updateKojiModalUI();
        }

        block.querySelectorAll('.hcamp-opt').forEach(lbl => {
            let cb = lbl.querySelector('input');
            let txt = lbl.innerText;
            let is10GCampaign = txt.includes("10ギガ") || txt.includes("10G");
            
            if (is10GCampaign) {
                if (!is10G) {
                    cb.checked = false;
                    cb.disabled = true;
                    lbl.style.opacity = "0.4";
                } else {
                    cb.disabled = false;
                    lbl.style.opacity = "1";
                }
            }
        });

        const devId = devSel ? devSel.value : "none";
        const payM = block.querySelector('.hPaySelect')?.value || "36";
        const pId = planSel ? planSel.value : "none";
        const pObj = hPlan[pId] || {price:0, raw:{}};
        
        let pTot = pObj.price;
        block.querySelectorAll('.dyn-hopt input:checked').forEach(cb => pTot+=Number(cb.closest('.check-label').getAttribute("data-price")));
        if(block.querySelector('.col-total-plan')) block.querySelector('.col-total-plan').innerText = pTot.toLocaleString();

        let devM2 = 0, supM2 = 0;
        let dObj = hDev[devId];
        if (dObj) {
           if(payM==='12') devM2 = dObj.d12_2; else if(payM==='24') devM2 = dObj.d24_2; else if(payM==='36') devM2 = dObj.d36_2; else if(payM==='48') devM2 = dObj.d48_2;
           if(dObj.sup_t >= 2) supM2 = dObj.sup_2;
        }

        const supNotice = block.querySelector('.monthly-support-notice');
        if (supNotice) {
            if (supM2 > 0) {
                supNotice.style.display = "block";
                let msVal = supNotice.querySelector('.ms-val');
                if(msVal) msVal.innerText = supM2.toLocaleString();
            } else {
                supNotice.style.display = "none";
            }
        }

        const kojiPayMode = block.querySelector('.hKojiPaySelect')?.value || "24";
        let kFeeM2 = 0;
        let monthKojiArr = new Array(48).fill(0);
        let kojiTotalSum = 0; 
        let kojiCheckedCount = 0;

        block.querySelectorAll('.dyn-hkoji input:checked').forEach(cb => {
            kojiCheckedCount++;
            const lbl = cb.closest('.check-label');
            let total = Number(lbl.getAttribute("data-total")) || 0;
            kojiTotalSum += total; 
            
            let m1 = 0, m2 = 0, times = 1;

            if (kojiPayMode === '1') {
                times = 1; m1 = total; m2 = 0;
            } else if (kojiPayMode === '12') {
                times = 12; 
                m1 = Number(lbl.getAttribute("data-d12m1")) || 0; 
                m2 = Number(lbl.getAttribute("data-d12m2")) || 0;
            } else {
                times = 24; 
                m1 = Number(lbl.getAttribute("data-d24m1")) || 0; 
                m2 = Number(lbl.getAttribute("data-d24m2")) || 0;
            }

            if (times >= 2) kFeeM2 += m2;

            for (let i = 0; i < 48; i++) {
                if (i === 0) monthKojiArr[i] += m1;
                else if (i < times) monthKojiArr[i] += m2;
            }
        });

        if(block.querySelector('.koji-total-display')) {
            block.querySelector('.koji-total-display').innerText = kojiTotalSum.toLocaleString();
        }
        
        const kojiSummary = block.querySelector('.displayHKojiText');
        if (kojiSummary) {
            if (kojiCheckedCount === 0) {
                kojiSummary.innerText = "選択なし";
                kojiSummary.style.color = "#888";
            } else {
                kojiSummary.innerHTML = `<span style="color:#cc0000;">${kojiCheckedCount}件選択中</span>`;
            }
        }

        if(block.querySelector('.col-total-device')) block.querySelector('.col-total-device').innerText = (devM2 + kFeeM2).toLocaleString();

        let dM2 = 0;
        hDisc.forEach(d => {
           let cb=block.querySelector(`.hcamp-opt-${d.id} input`);
           if(cb&&cb.checked) {
              let v = Number(pObj.raw[d.id+'_val']) || 0;
              if(v===0 && d.price) v = d.price;
              if(v===0 && d.name.includes("ワンコイン")) v = Math.max(0, pTot - 500);
              dM2 += v;
           }
        });
        if(block.querySelector('.col-total-discount')) block.querySelector('.col-total-discount').innerText = (dM2 + supM2).toLocaleString();

        let aFee = 3300; adminTot += aFee; 

        for(let m=1; m<=48; m++){
           let md = 0;
           hDisc.forEach(d=>{ let cb=block.querySelector(`.hcamp-opt-${d.id} input`); if(cb&&cb.checked){ 
               let v=Number(pObj.raw[d.id+'_val'])||0; 
               if(v===0 && d.price) v = d.price;
               if(v===0 && d.name.includes("ワンコイン")) v = Math.max(0, pTot - 500);
               let dur = d.duration || (d.name.includes("ワンコイン") ? 6 : 0);
               if(dur===0||m<=dur)md+=v; 
           } });

           let dv = 0, sup = 0;
           if (dObj) {
              if(payM==='1' && m===1) dv = dObj.price_total;
              else if(payM==='12' && m<=12) dv = (m===1)?dObj.d12_1:dObj.d12_2;
              else if(payM==='24' && m<=24) dv = (m===1)?dObj.d24_1:dObj.d24_2;
              else if(payM==='36' && m===1) dv = dObj.d36_1; else if(payM==='36' && m<=36) dv = dObj.d36_2;
              else if(payM==='48' && m===1) dv = dObj.d48_1; else if(payM==='48' && m<=48) dv = dObj.d48_2;
              if(m===1) sup=dObj.sup_1; else if(m<=dObj.sup_t) sup=dObj.sup_2;
           }
           
           dv += monthKojiArr[m-1];

           let pFinal = Math.max(0, pTot - md - sup);
           if(m===1) arrP[m-1]+=(pFinal+aFee); else arrP[m-1]+=pFinal;
           arrD[m-1]+=dv;

           if(m===2){ lM2 = pFinal+dv; grandM2 += lM2; }
        }
        if(block.querySelector('.line-final-total')) block.querySelector('.line-final-total').innerText = lM2.toLocaleString();
        if (block.id === activeLineId) singleActiveM2 = lM2;
        let bClass = (block.id===activeLineId) ? 'fixed-badge active-badge' : 'fixed-badge';
        bHtml += `<div class="line-badge ${bClass}" onclick="switchTab('${block.id}')">🌐 ${index+1}回線目<span>${lM2.toLocaleString()}円</span></div>`;
      }
    });

    if(document.getElementById("bottomLineTotals")) document.getElementById("bottomLineTotals").innerHTML = bHtml;
    
    let displayPrice = currentDisplayMode === 'all' ? grandM2 : singleActiveM2;
    if(document.getElementById("grandTotalDisplay")) document.getElementById("grandTotalDisplay").innerText = displayPrice.toLocaleString();

    if(myChart){ myChart.data.datasets[0].data=arrD; myChart.data.datasets[1].data=arrP; myChart.update(); }
    generateTimeline(arrP, arrD, adminTot);
  }

  function generateTimeline(arrP, arrD, aFee) {
    let html = `<table class="timeline-table"><tbody><tr><th>1ヵ月目 (合算)</th><td><div style="margin-bottom:4px;">・契約事務手数料等: <span class="price-red">${aFee.toLocaleString()}円</span></div><div style="margin-bottom:4px;">・通信/OP料: <span class="price-red">${(arrP[0]-aFee).toLocaleString()}円</span></div><div>・機器/工事費: <span class="price-red">${arrD[0].toLocaleString()}円</span></div><div style="margin-top:8px; background:#eee; padding:4px 8px; display:inline-block; font-weight:bold;">計: ${(arrP[0]+arrD[0]).toLocaleString()}円</div></td></tr><tr><th>2〜23ヵ月目 (合算)</th><td><div style="margin-bottom:4px;">・通信/OP料: <span class="price-red">${arrP[1].toLocaleString()}円/月</span></div><div>・機器/工事費: <span class="price-red">${arrD[1].toLocaleString()}円/月</span></div><div style="margin-top:8px; background:#e6f2ff; color:#0066cc; padding:4px 8px; display:inline-block; font-weight:bold;">合算目安: ${(arrP[1]+arrD[1]).toLocaleString()}円</div></td></tr><tr><th>24ヵ月目〜 (合算)</th><td><div style="margin-bottom:4px;">・通信/OP料: <span class="price-red">${arrP[23].toLocaleString()}円/月</span></div><div>・機器残価等: <span class="price-red">${arrD[23].toLocaleString()}円</span></div></td></tr></tbody></table>`;
    if(document.getElementById('timelineContainer')) document.getElementById('timelineContainer').innerHTML = html;
  }

  window.onload = () => {
    document.getElementById('addMobileBtn').disabled = true;
    document.getElementById('addFixedBtn').disabled = true;
    init();
  };
</script>
